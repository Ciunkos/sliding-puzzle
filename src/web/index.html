<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sliding Puzzle: slide the tiles into order</title>
    <meta
      name="description"
      content="A free sliding tile puzzle from 3×3 to 5×5. Play at once, no sign-up: your game is saved under a nickname in the link, and it plays offline."
    />
    <link rel="canonical" href="https://ciunkos.com/sliding-puzzle" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0d14" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The icon inline (the same drawing as /icons/icon.svg): the browser fetches the tab icon
         again when the page starts playing sound, and an inline one needs no network. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='96' fill='%231d4ed8'/><g fill='%23fff'><rect x='76' y='76' width='108' height='108' rx='18'/><rect x='202' y='76' width='108' height='108' rx='18'/><rect x='328' y='76' width='108' height='108' rx='18'/><rect x='76' y='202' width='108' height='108' rx='18'/><rect x='202' y='202' width='108' height='108' rx='18'/><rect x='328' y='202' width='108' height='108' rx='18'/><rect x='76' y='328' width='108' height='108' rx='18'/></g><rect x='244' y='328' width='108' height='108' rx='18' fill='%23fbbf24'/><path d='M376 382 l-22 -20 v40 z' fill='%23fbbf24'/></svg>"
    />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Puzzle" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ciunkos.com/sliding-puzzle" />
    <meta property="og:title" content="Sliding Puzzle" />
    <meta
      property="og:description"
      content="Slide the tiles into order, from 3×3 to 5×5. No sign-up; your game is saved in the link."
    />
    <meta property="og:image" content="https://ciunkos.com/sliding-puzzle/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A wooden sliding puzzle of a cat picture, half solved, with the moves, the time, Reset and New game around it."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The page's own styles, here so the first paint already has them (no flash, no shift). -->
    <style>
      body {
        margin: 0;
        background: #f4ead8;
        color: #2b1d10;
      }
      /* Exactly one screen (svh: with the browser's bars shown), never a scrolling page: a game
         lays itself out inside it, and nothing comes after it that could be pushed (no layout
         shift). A screen taller than that (a profile page on a small phone) scrolls inside. */
      main {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100svh;
        overflow-y: auto;
        font-family: system-ui, sans-serif;
      }
      /* The feature's screen takes the whole of main. */
      main > * {
        flex: 0 0 auto;
      }
      main > :last-child {
        flex: 1 1 auto;
        min-height: 0;
      }
      /* The page's heading, for screen readers and search: the game is the page's picture. */
      main > h1 {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #14100c;
          color: #f3e9da;
        }
      }
    </style>
  </head>
  <body>
    <!-- React replaces this with the same main and heading, so nothing moves when it starts. -->
    <div id="root">
      <main>
        <h1>Sliding Puzzle</h1>
        <noscript>
          <p>Sliding Puzzle needs JavaScript. Turn it on in your browser to play.</p>
        </noscript>
      </main>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
