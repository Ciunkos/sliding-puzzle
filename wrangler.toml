name = "sliding-puzzle"
main = "src/server/worker.ts"
compatibility_date = "2026-11-05"
workers_dev = true
routes = [
  { pattern = "ciunkos.com/sliding-puzzle*", zone_name = "ciunkos.com" },
  { pattern = "www.ciunkos.com/sliding-puzzle*", zone_name = "ciunkos.com" },
]

# Secrets (never in this file): POSTHOG_PROJECT_TOKEN, set with `wrangler secret put`.
# Optional var POSTHOG_HOST overrides the EU ingest host.

[assets]
directory = "dist/web"
binding = "ASSETS"
html_handling = "drop-trailing-slash"
run_worker_first = [
  "/sliding-puzzle/",
  "/sliding-puzzle/api/*",
  "/sliding-puzzle/analytics-config",
  "/sliding-puzzle/ph/*",
]

[[d1_databases]]
binding = "DB"
database_name = "sliding-puzzle"
# Paste the id printed by `wrangler d1 create sliding-puzzle` here (see DEPLOY.md). Local runs
# (`wrangler dev`, `--local` migrations) work with this placeholder.
database_id = "c1e78e90-6bf4-45a3-994f-8aee30141e21"
migrations_dir = "migrations"
